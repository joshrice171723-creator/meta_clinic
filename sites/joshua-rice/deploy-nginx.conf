# Include inside the existing aimetaclinic.com HTTPS server block.
location = /Joshua {
    return 301 /joshua/$is_args$args;
}

location = /Joshua/ {
    return 301 /joshua/$is_args$args;
}

location = /joshua {
    return 301 /joshua/$is_args$args;
}

location ^~ /joshua/ {
    root /var/www/joshua-portfolio/current;
    index index.html;
    try_files $uri $uri/ =404;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
}
