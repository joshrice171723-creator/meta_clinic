# Leave the main model and reasoning effort to the user's selection.
model_reasoning_summary = "auto"

[agents]
# Economical defaults for assistant-spawned workers only.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 2

# Official Material UI documentation and published component examples.
[mcp_servers.mui-mcp]
command = "npx"
args = ["-y", "@mui/mcp@latest"]
startup_timeout_sec = 60
