# This replaces the packaged default listener. There is NO public HTTP listener.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost;
    ssl_certificate /etc/apply/tls/localhost.crt;
    ssl_certificate_key /etc/apply/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    if ($host != localhost) { return 444; }
    location ~ ^/(api(?:/|$)|up$) {
      proxy_pass http://127.0.0.1:3001;
      proxy_set_header Host localhost:8443;
      proxy_set_header X-Forwarded-Host localhost:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded '';
      proxy_read_timeout 60s;
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host localhost:8443;
      proxy_set_header X-Forwarded-Host localhost:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded '';
      proxy_read_timeout 60s;
    }
  }
}
