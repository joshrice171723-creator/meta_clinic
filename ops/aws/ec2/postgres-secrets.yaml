AWSTemplateFormatVersion: '2010-09-09'
Description: Add PostgreSQL credentials to an existing APPly host without replacing its instance or volumes.
Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  HostRoleName:
    Type: String
Resources:
  OwnerKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub APPly ${Environment} PostgreSQL maintenance credential
      GenerateSecretString: {PasswordLength: 64, ExcludePunctuation: true}
  RuntimeKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub APPly ${Environment} PostgreSQL application credential
      GenerateSecretString: {PasswordLength: 64, ExcludePunctuation: true}
  ReadCredentials:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub apply-${Environment}-postgres-credentials
      Roles: [!Ref HostRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: [!Ref OwnerKey, !Ref RuntimeKey]
Outputs:
  OwnerSecret:
    Value: !Ref OwnerKey
  RuntimeSecret:
    Value: !Ref RuntimeKey
