AWSTemplateFormatVersion: '2010-09-09'
Description: APPly delivery roles; trusted GitHub main and production environment only.
Parameters:
  GitHubSubjectPrefix:
    Type: String
    Description: Exact repo subject prefix, including immutable IDs when enabled; no wildcards
    AllowedPattern: 'repo:[A-Za-z0-9_.@-]+/[A-Za-z0-9_.@-]+'
  StagingInstance:
    Type: String
    AllowedPattern: 'i-[a-f0-9]+'
  ProductionInstance:
    Type: String
    AllowedPattern: 'i-[a-f0-9]+'
  StagingRepository:
    Type: String
    AllowedPattern: '[a-z0-9/_-]+'
  ProductionRepository:
    Type: String
    AllowedPattern: '[a-z0-9/_-]+'
Resources:
  GitHubIdentity:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  ReleaseCommand:
    Type: AWS::SSM::Document
    Properties:
      Name: apply-deploy-release
      DocumentType: Command
      Content:
        schemaVersion: '2.2'
        description: Install only a digest from the host's configured repository
        parameters:
          image:
            type: String
            allowedPattern: '[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/[a-z0-9/_-]+@sha256:[a-f0-9]{64}'
            interpolationType: ENV_VAR
          webImage:
            type: String
            allowedPattern: '[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/[a-z0-9/_-]+@sha256:[a-f0-9]{64}'
            interpolationType: ENV_VAR
          generation:
            type: String
            allowedPattern: '[0-9]{1,18}'
            interpolationType: ENV_VAR
        mainSteps:
          - action: aws:runShellScript
            name: deploy
            inputs:
              timeoutSeconds: '600'
              runCommand:
                - 'set -eu'
                - 'exec /usr/local/sbin/apply-install-release "$SSM_image" "$SSM_webImage" "$SSM_generation"'
  StagingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: apply-github-staging
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubIdentity}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${GitHubSubjectPrefix}:ref:refs/heads/main'
      Policies:
        - PolicyName: StagingReleaseOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:DescribeImages, ecr:DescribeImageScanFindings]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${StagingRepository}'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ReleaseCommand}'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${StagingInstance}'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/apply/releases/staging'
  ProductionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: apply-github-production
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubIdentity}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${GitHubSubjectPrefix}:environment:production'
      Policies:
        - PolicyName: ProductionPromotionOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:DescribeImages, ecr:DescribeImageScanFindings]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${StagingRepository}'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:DescribeImages]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProductionRepository}'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ReleaseCommand}'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ProductionInstance}'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/apply/releases/staging'
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/apply/releases/production'
Outputs:
  StagingRoleArn:
    Value: !GetAtt StagingRole.Arn
  ProductionRoleArn:
    Value: !GetAtt ProductionRole.Arn
  ReleaseDocument:
    Value: !Ref ReleaseCommand
