name: meta-clinic

x-app-environment: &app-environment
  RAILS_ENV: production
  APP_DEPLOYMENT_ENV: ${APP_DEPLOYMENT_ENV:?required}
  APP_SITE_ORIGIN: ${APP_SITE_ORIGIN:?required}
  APP_DEVELOPMENT_LOGIN: "0"
  APP_CLINIC_PILOT_PRACTICE_IDS: ${APP_CLINIC_PILOT_PRACTICE_IDS:-}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?required}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?required}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?required}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?required}
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: apply
  PGUSER: apply_runtime
  PGPASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?required}
  PORT: "3000"

x-api: &api
  image: ghcr.io/${IMAGE_OWNER:?required}/meta-clinic-api:${IMAGE_TAG:?required}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /rails/tmp:uid=1000,gid=1000,mode=0700
    - /rails/log:uid=1000,gid=1000,mode=0700
    - /tmp:mode=1777,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: apply
      POSTGRES_USER: apply_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-runtime-user.sql:/docker-entrypoint-initdb.d/10-runtime-user.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U apply_owner -d apply]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *api
    restart: "no"
    profiles: [tools]
    environment:
      <<: *app-environment
      PGUSER: apply_owner
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD:?required}
    command: ["./bin/rails", "db:prepare"]

  api:
    <<: *api
    command: ["./bin/rails", "server"]

  worker:
    <<: *api
    command: ["./bin/clinic-worker", "--interval", "15"]

  web:
    image: ghcr.io/${IMAGE_OWNER:?required}/meta-clinic-web:${IMAGE_TAG:?required}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:uid=101,gid=101,mode=0700,size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  edge:
    image: nginx:stable-alpine
    restart: unless-stopped
    read_only: true
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/meta-clinic/tls:ro
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700,size=32m
      - /var/cache/nginx:uid=101,gid=101,mode=0700,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [api, web]

volumes:
  postgres-data:
