name: meta-clinic-demo

x-api: &api
  image: ${API_IMAGE:?Set an immutable API image}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /rails/tmp:uid=1000,gid=1000,mode=0700
    - /rails/log:uid=1000,gid=1000,mode=0700
    - /tmp:mode=1777,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file: /opt/meta-clinic/secrets/runtime.env
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    env_file: /opt/meta-clinic/secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U apply_owner -d apply]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  migrate:
    <<: *api
    restart: "no"
    profiles: [tools]
    env_file:
      - /opt/meta-clinic/secrets/runtime.env
      - /opt/meta-clinic/secrets/owner.env
    command: ["./bin/rails", "db:prepare"]
    volumes:
      - ./provision-demo.rb:/opt/provision-demo.rb:ro
      - /opt/meta-clinic/secrets/demo-password:/run/secrets/demo-password:ro
  api:
    <<: *api
    ports: ["127.0.0.1:3001:3000"]
    command: ["./bin/rails", "server"]
  worker:
    <<: *api
    command: ["bundle", "exec", "./bin/clinic-worker", "--interval", "15"]
  web:
    image: ${WEB_IMAGE:?Set an immutable web image}
    restart: unless-stopped
    read_only: true
    ports: ["127.0.0.1:8081:8080"]
    tmpfs: ["/tmp:uid=101,gid=101,mode=0700,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
