# Include INSIDE the existing aimetaclinic.com HTTPS server block.
# Do not replace its TLS, authentication, proxy, or other location configuration.
location = /version.json {
    alias /var/lib/meta-clinic-release/public/current/version.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    open_file_cache off;
}
location = /update-log.json {
    alias /var/lib/meta-clinic-release/public/current/version.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    open_file_cache off;
}
location = /version {
    alias /var/lib/meta-clinic-release/public/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    open_file_cache off;
}
location = /update-log {
    alias /var/lib/meta-clinic-release/public/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    open_file_cache off;
}
