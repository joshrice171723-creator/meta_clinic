server {
    listen 443 ssl;
    server_name 184.194.129.57;
    ssl_certificate /etc/letsencrypt/live/184.194.129.57/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/184.194.129.57/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /stripe/connect/webhook {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:3001;
    }
    location ~ ^/qa/(status|issues|atlas|retest|batches)\.json$ {
        proxy_set_header Host 184.194.129.57;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        rewrite ^/qa/(.*)$ /api/qa/$1 break;
        proxy_pass http://127.0.0.1:3001;
    }
    location ~ ^/(api(?:/|$)|up$) {
        proxy_set_header Host 184.194.129.57;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:3001;
    }
    location / {
        proxy_set_header Host 184.194.129.57;
        proxy_pass http://127.0.0.1:8081;
    }
}
