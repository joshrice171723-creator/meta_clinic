name: Promote production
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Exact API sha256 digest from the successful staging pair
        required: true
        type: string
      web_digest:
        description: Exact frontend sha256 digest from the same staging pair
        required: true
        type: string
      confirmation:
        description: Type promote-production after reviewing staging
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: apply-production-deployment
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'promote-production'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            apps/api
            ops/aws/ec2
      - name: Read non-secret deployment targets
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open('ops/aws/ec2/targets.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ROLE_ARN=' + c['production']['role'] + '\n')
              f.write('REGISTRY=' + c['account'] + '.dkr.ecr.us-east-1.amazonaws.com\n')
          PY
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: apply-production-${{ github.run_id }}
      - name: Promote the verified staging digest without rebuilding
        env:
          EXPECTED_DIGEST: ${{ inputs.digest }}
          EXPECTED_WEB_DIGEST: ${{ inputs.web_digest }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"
          trap 'docker logout "$REGISTRY" >/dev/null 2>&1' EXIT
          python3 ops/aws/ec2/release.py production --expected-digest "$EXPECTED_DIGEST" --expected-web-digest "$EXPECTED_WEB_DIGEST"
