worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    etag off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter "__APPLY_CSP_NONCE__" $request_id;
    location = /health { return 200 "web ready\n"; }
    # The outer environment-specific edge and Rails own hosted clinic release
    # authorization. This static shell contains no records or credentials.
    location ~ ^/clinic(?:/|$) { try_files /index.html =404; }
    # An edge proxy, not the static web container, owns API routing.
    location ~ ^/(?:api(?:/|$)|up$) { return 404; }
    location ~ ^/(?:|contact|login|portal(?:/settings)?|paperwork(?:/[0-9]+)?|training(?:/[0-9]+)?|materials(?:/[0-9]+)?|inquiries|patient-portal(?:/settings|/activate)?|workforce/(?:activate|kiosk))/?$ {
      try_files /index.html =404;
    }
    location /assets/ { try_files $uri =404; }
    location ~ ^/(?:shared\.css|launch\.css|clinic\.css|favicon\.svg|og\.png|robots\.txt)$ { try_files $uri =404; }
    location / { return 404; }
  }
}
