worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Use the original URI: try_files can internally rewrite it to index.html.
  # Clinic navigation stays in one document, so media permission follows its
  # authenticated SPA shell rather than only the initial video route.
  map $request_uri $apply_media_policy {
    default "camera=(), microphone=(), display-capture=(), geolocation=()";
    ~^/(clinic|patient-portal|demo)(/|\?|$) "camera=(self), microphone=(self), display-capture=(self), geolocation=()";
  }
  map $request_uri $apply_frame_policy {
    default DENY;
    ~^/(clinic|memberships|demo)(/|\?|$) SAMEORIGIN;
  }
  map $request_uri $apply_content_policy {
    default "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(clinic|patient-portal|memberships|demo)(/|\?|$) "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.twilio.com wss://*.twilio.com; frame-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  }
  map $uri $apply_cache_policy {
    default "no-store";
    "~^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|svg|png|webp|avif|woff2|woff|ttf|otf)$" "public, max-age=31536000, immutable";
  }
  server {
    listen 8080;
    client_max_body_size 8m;
    root /usr/share/nginx/html;
    etag off;
    add_header Cache-Control $apply_cache_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options $apply_frame_policy always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy $apply_media_policy always;
    add_header Content-Security-Policy $apply_content_policy always;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter "__APPLY_CSP_NONCE__" $request_id;
    location = /health { return 200 "web ready\n"; }
    location = /build.json { try_files $uri =404; }
    location = /qa { try_files /index.html =404; }
    location ~ ^/qa/(status|issues|retest|batches)\.json$ {
      proxy_pass http://api:3000/api$request_uri;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
    }
    # The outer environment-specific edge and Rails own hosted clinic release
    # authorization. This static shell contains no records or credentials.
    location ~ ^/(demo|memberships)(?:/|$) { try_files /index.html =404; }
    location ~ ^/clinic(?:/|$) { try_files /index.html =404; }
    location ~ ^/patient-portal(?:/|$) { try_files /index.html =404; }
    # Public marketing routes use the same frontend shell, including direct visits.
    location ~ ^/(?:about|affiliate-program|ai|ai-intake|alternatives|behavioral-health|book-demo|careers|company|compare|customers|direct-primary-care|founder|get-started|hormone-therapy|i2e|infusion|integrations|inventory|iv-therapy|legal|longevity|med-spa|mens-health|meta-clinic|partner-program|partners|physical-therapy|pilot|platform|pricing|primary-care|psychiatry|request-demo|resources|reviews|sandbox|security|signup|site-map|solutions|testimonials|try|weight-loss|weight-loss-clinics)(?:/|$) { try_files /index.html =404; }
    # An edge proxy, not the static web container, owns API routing.
    location ~ ^/(?:api(?:/|$)|up$) { return 404; }
    location ~ ^/(?:|contact|login|owner(?:/(?:activate|password-reset))?|portal(?:/settings)?|paperwork(?:/[0-9]+)?|training(?:/[0-9]+)?|materials(?:/[0-9]+)?|inquiries|patient-portal(?:/settings|/activate)?|workforce/(?:activate|kiosk))/?$ {
      try_files /index.html =404;
    }
    location /assets/ { try_files $uri =404; }
    location /marketing/ { try_files $uri =404; }
    location = /visit-tracking.js { try_files $uri =404; }
    location ~ ^/(?:shared\.css|launch\.css|clinic\.css|favicon\.svg|og\.png|robots\.txt)$ { try_files $uri =404; }
    location / { return 404; }
  }
}
