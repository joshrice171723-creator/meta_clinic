# Separate databases in every environment. Hosted credentials are secret-managed.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1").to_json %>
  port: <%= ENV.fetch("PGPORT", 54329) %>
  username: <%= ENV.fetch("PGUSER", "postgres").to_json %>
  password: <%= ENV["PGPASSWORD"].to_json %>
  connect_timeout: 5
  variables:
    statement_timeout: 15000
    lock_timeout: 5000
    idle_in_transaction_session_timeout: 30000

development:
  <<: *default
  database: <%= ENV.fetch("APPLY_DEVELOPMENT_DATABASE", "apply_development").to_json %>

test:
  <<: *default
  database: <%= ENV.fetch("APPLY_TEST_DATABASE", "apply_test").to_json %>

production:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "apply").to_json %>
